name: StackRadar Release (dmg / exe / AppImage)

# Builds installers for macOS, Windows and Linux and publishes them to a GitHub Release, which the
# desktop app's auto-updater (electron-updater) reads. A release starts when either
#   - a commit on main changes VERSION (scripts/bump_version.py) and v<VERSION> isn't released yet, or
#   - a tag v<VERSION> is pushed.
# The release (and its tag, if missing) is created by this workflow.
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/stackradar-release.yml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases (otherwise just upload build artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stackradar-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Is there a version to release?
        run: |
          V="$(cat VERSION)"; echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "v$V" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ($V). Run scripts/bump_version.py first."; exit 1
          fi
          DRAFT="$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)"
          if [[ "$DRAFT" == "false" ]]; then
            echo "v$V is already released."; echo "release=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" || "${{ inputs.publish }}" == "true" ]]; then
            echo "Releasing v$V."; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests -v

  # Create the draft release first so the three builds upload into one release (no race), with
  # the generated notes: changelog + download table + install steps for unsigned macOS / Windows builds.
  draft:
    needs: [check, test]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release_notes.py
      - name: Draft release
        run: |
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --title "StackRadar $V" --target "$GITHUB_SHA" --notes-file desktop/build/release-notes.md
          else
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "StackRadar $V" --notes-file desktop/build/release-notes.md
          fi

  build:
    needs: [check, test, draft]
    # release builds, or a manual run (artifacts only)
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.draft.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.draft.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # unsigned builds unless you add signing secrets (CSC_LINK / CSC_KEY_PASSWORD, APPLE_ID …)
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK && 'true' || 'false' }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Python (macOS — universal2 from python.org so one backend runs on Intel + Apple silicon)
        if: runner.os == 'macOS'
        run: |
          curl -sSLo /tmp/py.pkg https://www.python.org/ftp/python/3.12.8/python-3.12.8-macos11.pkg
          sudo installer -pkg /tmp/py.pkg -target /
          echo "PYTHON=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3" >> "$GITHUB_ENV"
          echo "DR_UNIVERSAL=1" >> "$GITHUB_ENV"
      - name: Python (Windows / Linux)
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: PyInstaller
        run: |
          PY="${PYTHON:-python}"
          "$PY" -m pip install --upgrade pip pyinstaller
          echo "PYTHON=$PY" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci

      - name: Release notes
        run: '"$PYTHON" ../scripts/release_notes.py'

      - name: Freeze the StackRadar engine
        run: node scripts/build-backend.js

      - name: Build installers
        run: |
          if [[ "${{ needs.check.outputs.release }}" == "true" ]]; then PUB=always; else PUB=never; fi
          # secrets that aren't set arrive as empty strings; electron-builder would read CSC_LINK="" as a file path
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!v}" ]]; then unset "$v"; fi
          done
          EXTRA=""
          # no Apple certificate → ad-hoc sign so Apple-silicon Macs will launch it (Gatekeeper still asks once)
          if [[ "${{ runner.os }}" == "macOS" && -z "$CSC_LINK" ]]; then EXTRA="-c.mac.identity=-"; fi
          npx electron-builder ${{ matrix.target }} --publish "$PUB" $EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: stackradar-${{ runner.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/latest*.yml
          if-no-files-found: warn

  # All three builds succeeded → add checksums and publish the draft (it becomes "Latest", and
  # installed apps see the update).
  publish:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: stackradar-*
          merge-multiple: true
      - name: Checksums + publish
        run: |
          TAG="v$(cat VERSION)"
          cd dist
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
