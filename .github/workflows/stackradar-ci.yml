name: StackRadar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + HTTP tests (stdlib only, no installs)
        run: python -m unittest discover -s tests -v
      - name: JS syntax check
        if: matrix.os == 'ubuntu-latest'
        run: for f in static/*.js desktop/*.js desktop/scripts/*.js; do node --check "$f"; done
