name: StackRadar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check
      - name: Install pinned dev tools from uv.lock
        run: uv sync --locked
      - name: Lint Python (ruff, config in pyproject.toml)
        run: uv run ruff check --output-format=github .
      - name: Type check (mypy, config in pyproject.toml)
        run: uv run mypy
      - name: JS syntax check
        run: for f in static/*.js desktop/*.js desktop/scripts/*.js; do node --check "$f"; done

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test tools from uv.lock
        run: uv sync --locked
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          echo '### Test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=total | sed 's/$/% of lines and branches covered/' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          # Public repos need a (free) token: add it as the CODECOV_TOKEN repository secret.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
