name: 🐞 Bug report
description: Something in StackRadar is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security issue?** Don't file it here. Use [private vulnerability reporting](https://github.com/SYasJ/StackRadar/security/advisories/new).
        **Never paste API keys, tokens or `.env` contents.** StackRadar masks secrets, so please keep them masked here too.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the … tab
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run StackRadar?
      options:
        - Desktop app (dmg / exe / AppImage / deb)
        - From source (python3 stackradar.py)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StackRadar version
      description: Shown in Settings, or in the `VERSION` file.
      placeholder: "2.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version (if running from source)
      placeholder: "3.12.4"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output, browser console errors or screenshots. Remove anything sensitive.
      render: shell
