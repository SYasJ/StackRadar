name: ✨ Feature request
description: Suggest an idea or improvement for StackRadar.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/SYasJ/StackRadar/blob/main/ROADMAP.md) first. Your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I often need to … but StackRadar doesn't …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should StackRadar do? Mock-ups are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Projects / overview
        - Network Guard
        - Ports
        - Lineage graph
        - System monitor
        - AI agents & skills
        - Schedules
        - Duplicates / disk / caches
        - Tools & packages
        - Desktop app / updates
        - Themes / settings
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
