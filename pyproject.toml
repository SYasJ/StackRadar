# Project manifest for StackRadar.
# StackRadar runs on the Python standard library alone: `python3 stackradar.py`, no installs.
# This file declares project metadata, the supported Python range, the pinned dev tools
# (`uv sync` reproduces them from uv.lock) and how to build an installable package:
#     pipx install git+https://github.com/SYasJ/StackRadar      →  `stackradar` command

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stackradar"
version = "2.2.0"
description = "Local developer-workspace dashboard and network guard: every repo, port, secret, AI agent, skill, schedule and package on one screen."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yasir Jilani", email = "27597591+SYasJ@users.noreply.github.com" }]
keywords = ["developer-tools", "dashboard", "network-monitor", "firewall", "secrets-scanner", "port-monitor", "ai-agents", "claude-code", "local-first"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: System :: Monitoring",
]
dependencies = []  # standard library only

[project.scripts]
stackradar = "stackradar:main"

[project.urls]
Homepage = "https://syasj.github.io/StackRadar/"
Source = "https://github.com/SYasJ/StackRadar"
Documentation = "https://github.com/SYasJ/StackRadar/wiki"
Changelog = "https://github.com/SYasJ/StackRadar/blob/main/CHANGELOG.md"
Issues = "https://github.com/SYasJ/StackRadar/issues"

[dependency-groups]
dev = [
  "ruff==0.17.1",
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.15; python_version >= '3.10'",
]

[tool.uv]
# For development, uv only installs the dev tools; StackRadar itself runs straight from the checkout.
package = false

[tool.hatch.build.targets.wheel]
only-include = ["stackradar.py"]

[tool.hatch.build.targets.wheel.force-include]
# The web UI ships as a data folder next to the module (see APP_DIR in stackradar.py).
"index.html" = "stackradar_app/index.html"
"static" = "stackradar_app/static"
"VERSION" = "stackradar_app/VERSION"

[tool.hatch.build.targets.sdist]
include = ["stackradar.py", "index.html", "static", "VERSION", "LICENSE", "COMMERCIAL.md", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
# `pytest` (or `make test`) runs the whole suite; the tests are plain unittest classes.
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["stackradar", "scripts"]
branch = true

[tool.coverage.report]
show_missing = false
skip_empty = true

[tool.mypy]
# Type check in CI. Runs as 3.10 (newest mypy can't target 3.9; ruff enforces 3.9 syntax).
python_version = "3.10"
files = ["stackradar.py", "scripts", "tests", "demo"]
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
target-version = "py39"
line-length = 200
extend-exclude = ["desktop/node_modules", "desktop/release", "dist", "build", "_site", "_wiki"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports/variables, ...) + syntax errors.
select = ["E9", "F"]
